[package]
name = "co-agent-app"
version = "0.1.1"
description = "Lightweight desktop console for Co-Agent"
authors = ["Co-Agent contributors"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/yuunnn/co-agent"

[lib]
name = "co_agent_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
